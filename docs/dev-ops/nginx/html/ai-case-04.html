<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI对话助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 自定义滚动条 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }

        /* 打字机效果 */
        .typing-effect::after {
            content: '|';
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* 消息气泡动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-bubble {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="container mx-auto p-4 max-w-6xl">
    <!-- 标题 -->
    <header class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-gray-800">AI对话助手</h1>
        <p class="text-gray-600 mt-2">基于Spring AI的流式对话接口</p>
    </header>

    <div class="flex flex-col lg:flex-row gap-6">
        <!-- 左侧配置区域 -->
        <div class="lg:w-1/4 bg-white rounded-xl shadow-sm p-5 h-fit">
            <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                <i class="fas fa-cog mr-2 text-blue-500"></i> 模型配置
            </h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">模型名称</label>
                    <input
                            type="text"
                            id="modelInput"
                            value="deepseek-r1:1.5b"
                            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="输入模型名称"
                    >
                    <p class="text-xs text-gray-500 mt-1">例如：deepseek-r1:1.5b, llama2, 等</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">API地址</label>
                    <input
                            type="text"
                            id="apiUrlInput"
                            value="http://localhost:8090/api/v1/ollama/generate_stream"
                            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="输入API地址"
                    >
                </div>

                <div class="pt-4 border-t border-gray-200">
                    <h3 class="font-medium text-gray-700 mb-2">使用说明</h3>
                    <ul class="text-sm text-gray-600 space-y-1">
                        <li><i class="fas fa-circle text-xs text-blue-500 mr-2"></i> 输入消息后点击发送或按Enter键</li>
                        <li><i class="fas fa-circle text-xs text-blue-500 mr-2"></i> 流式响应会逐字显示</li>
                        <li><i class="fas fa-circle text-xs text-blue-500 mr-2"></i> 点击停止按钮可中断生成</li>
                        <li><i class="fas fa-circle text-xs text-blue-500 mr-2"></i> 支持多轮对话</li>
                    </ul>
                </div>

                <div class="pt-4">
                    <button
                            id="clearHistoryBtn"
                            class="w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-800 rounded-lg font-medium transition-colors flex items-center justify-center"
                    >
                        <i class="fas fa-trash-alt mr-2"></i> 清空对话历史
                    </button>
                </div>
            </div>
        </div>

        <!-- 右侧对话区域 -->
        <div class="lg:w-3/4 flex flex-col">
            <!-- 消息容器 -->
            <div
                    id="messagesContainer"
                    class="flex-grow bg-white rounded-xl shadow-sm p-5 mb-4 custom-scrollbar overflow-y-auto"
                    style="min-height: 500px; max-height: 600px;"
            >
                <!-- 初始欢迎消息 -->
                <div class="text-center py-10 text-gray-500">
                    <i class="fas fa-robot text-4xl mb-4 text-blue-500"></i>
                    <p class="text-lg font-medium">AI对话助手已就绪</p>
                    <p class="mt-2">输入消息开始对话，我将为您提供帮助</p>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="bg-white rounded-xl shadow-sm p-5">
                <div class="flex items-start gap-3">
                    <div class="flex-grow">
                        <div class="relative">
                                <textarea
                                        id="messageInput"
                                        rows="3"
                                        class="w-full p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pr-12 custom-scrollbar"
                                        placeholder="输入您的问题或消息..."
                                ></textarea>
                            <button
                                    id="sendButton"
                                    class="absolute right-3 bottom-3 p-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition-colors"
                                    title="发送消息"
                            >
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>

                        <div class="flex justify-between items-center mt-3">
                            <div class="flex items-center text-gray-600">
                                <i class="fas fa-info-circle mr-1 text-blue-500"></i>
                                <span class="text-sm">按 <kbd class="px-2 py-1 mx-1 bg-gray-100 rounded border">Enter</kbd> 发送，<kbd class="px-2 py-1 mx-1 bg-gray-100 rounded border">Shift+Enter</kbd> 换行</span>
                            </div>

                            <div class="flex items-center">
                                <div id="statusIndicator" class="hidden items-center mr-4">
                                    <div class="h-3 w-3 rounded-full bg-green-500 animate-pulse mr-2"></div>
                                    <span class="text-sm text-gray-600">AI正在思考...</span>
                                </div>

                                <button
                                        id="stopButton"
                                        class="hidden py-2 px-4 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg font-medium transition-colors flex items-center"
                                >
                                    <i class="fas fa-stop mr-2"></i> 停止生成
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部信息 -->
    <footer class="mt-8 text-center text-gray-500 text-sm">
        <p>基于 Spring AI 流式接口实现 | 使用 EventSource 处理流式响应</p>
    </footer>
</div>

<script>
    // DOM元素
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const stopButton = document.getElementById('stopButton');
    const modelInput = document.getElementById('modelInput');
    const apiUrlInput = document.getElementById('apiUrlInput');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const statusIndicator = document.getElementById('statusIndicator');

    // 状态变量
    let eventSource = null;
    let isGenerating = false;
    let currentMessageId = null;
    let accumulatedContent = ""; // 用于累积流式响应内容

    // 初始化 - 清空初始欢迎消息
    messagesContainer.innerHTML = '';

    // 发送消息函数
    function sendMessage() {
        const message = messageInput.value.trim();
        const model = modelInput.value.trim();
        const apiUrl = apiUrlInput.value.trim();

        if (!message) {
            alert('请输入消息内容');
            return;
        }

        if (!model) {
            alert('请输入模型名称');
            return;
        }

        if (!apiUrl) {
            alert('请输入API地址');
            return;
        }

        // 添加用户消息到界面
        addMessageToUI('user', message);

        // 清空输入框
        messageInput.value = '';

        // 重置累积内容
        accumulatedContent = "";

        // 显示AI消息占位符
        currentMessageId = Date.now().toString();
        addMessageToUI('assistant', '', currentMessageId);

        // 更新状态
        isGenerating = true;
        statusIndicator.classList.remove('hidden');
        stopButton.classList.remove('hidden');

        // 构建API URL
        const encodedMessage = encodeURIComponent(message);
        const fullApiUrl = `${apiUrl}?model=${encodeURIComponent(model)}&message=${encodedMessage}`;

        // 创建EventSource连接
        eventSource = new EventSource(fullApiUrl);

        // 处理接收到的消息
        eventSource.onmessage = function(event) {
            try {
                // 检查是否是空数据
                if (!event.data || event.data.trim() === '') {
                    return;
                }

                const data = JSON.parse(event.data);

                // 检查是否是数组格式（根据接口描述）
                let responseArray = data;
                if (!Array.isArray(data)) {
                    responseArray = [data];
                }

                responseArray.forEach(item => {
                    // 从result.output.content获取内容
                    const content = item.result?.output?.content || '';

                    // 累积内容
                    if (content) {
                        accumulatedContent += content;

                        // 更新AI消息内容
                        updateAssistantMessage(currentMessageId, accumulatedContent);
                    }

                    // 检查是否结束
                    const finishReason = item.result?.metadata?.finishReason;
                    if (finishReason === 'STOP') {
                        endGeneration();
                    }
                });
            } catch (error) {
                console.error('解析响应数据时出错:', error);
                console.error('原始数据:', event.data);

                // 尝试处理非标准JSON格式
                if (event.data && typeof event.data === 'string') {
                    // 可能是单个字符直接返回
                    accumulatedContent += event.data;
                    updateAssistantMessage(currentMessageId, accumulatedContent);
                }
            }
        };

        // 处理错误
        eventSource.onerror = function(error) {
            console.error('EventSource连接出错:', error);

            // 如果已经收到一些内容，显示已接收的内容
            if (accumulatedContent) {
                // updateAssistantMessage(currentMessageId, accumulatedContent + "\n\n❌ 连接中断");
            } else {
                updateAssistantMessage(currentMessageId, '❌ 连接出错，请检查API地址或网络连接');
            }

            endGeneration();
        };
    }

    // 添加消息到UI
    function addMessageToUI(role, content, messageId = null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message-bubble mb-5 ${role === 'user' ? 'text-right' : ''}`;

        if (messageId) {
            messageDiv.id = `message-${messageId}`;
        }

        // 消息内容
        const contentDiv = document.createElement('div');
        contentDiv.className = `inline-block max-w-[80%] p-4 rounded-2xl ${role === 'user' ? 'bg-blue-500 text-white rounded-br-none' : 'bg-gray-100 text-gray-800 rounded-bl-none'}`;

        // 如果是AI消息且内容为空，显示加载效果
        if (role === 'assistant' && !content) {
            contentDiv.innerHTML = `<div class="flex items-center"><div class="typing-effect"></div></div>`;
        } else {
            // 保留换行符
            contentDiv.innerHTML = content.replace(/\n/g, '<br>');
        }

        // 消息头部（角色和时间）
        const headerDiv = document.createElement('div');
        headerDiv.className = `flex items-center mb-2 ${role === 'user' ? 'justify-end' : ''}`;

        const icon = role === 'user' ?
            `<i class="fas fa-user-circle text-blue-500 text-xl"></i>` :
            `<i class="fas fa-robot text-green-500 text-xl"></i>`;

        const roleText = role === 'user' ? '您' : 'AI助手';
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        headerDiv.innerHTML = `
                ${role === 'user' ? '' : icon}
                <span class="mx-2 font-medium">${roleText}</span>
                ${role === 'user' ? icon : ''}
                <span class="text-xs text-gray-500">${time}</span>
            `;

        messageDiv.appendChild(headerDiv);
        messageDiv.appendChild(contentDiv);
        messagesContainer.appendChild(messageDiv);

        // 滚动到底部
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // 更新AI消息内容
    function updateAssistantMessage(messageId, content) {
        const messageElement = document.getElementById(`message-${messageId}`);
        if (messageElement) {
            const contentDiv = messageElement.querySelector('div:last-child');
            if (contentDiv) {
                // 移除打字机效果
                contentDiv.classList.remove('typing-effect');
                contentDiv.classList.remove('after:content-["|"]');

                // 更新内容，保留换行符
                contentDiv.innerHTML = content.replace(/\n/g, '<br>');

                // 滚动到底部
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
        }
    }

    // 结束生成
    function endGeneration() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }

        isGenerating = false;
        statusIndicator.classList.add('hidden');
        stopButton.classList.add('hidden');

        // 移除打字机效果
        if (currentMessageId) {
            const messageElement = document.getElementById(`message-${currentMessageId}`);
            if (messageElement) {
                const contentDiv = messageElement.querySelector('div:last-child');
                if (contentDiv) {
                    contentDiv.classList.remove('typing-effect');
                }
            }
        }
    }

    // 停止生成
    function stopGeneration() {
        if (eventSource) {
            eventSource.close();
            eventSource = null;
        }

        isGenerating = false;
        statusIndicator.classList.add('hidden');
        stopButton.classList.add('hidden');

        // 更新消息状态
        if (currentMessageId) {
            const messageElement = document.getElementById(`message-${currentMessageId}`);
            if (messageElement) {
                const contentDiv = messageElement.querySelector('div:last-child');
                if (contentDiv) {
                    const currentText = contentDiv.textContent;
                    contentDiv.innerHTML = currentText + '<br><span class="text-red-500">(已停止)</span>';
                }
            }
        }
    }

    // 清空对话历史
    function clearHistory() {
        if (isGenerating) {
            if (!confirm('AI正在生成内容，确定要清空历史吗？')) {
                return;
            }
            stopGeneration();
        }

        messagesContainer.innerHTML = '';

        // 添加清空后的提示
        const emptyDiv = document.createElement('div');
        emptyDiv.className = 'text-center py-10 text-gray-500';
        emptyDiv.innerHTML = `
                <i class="fas fa-robot text-4xl mb-4 text-blue-500"></i>
                <p class="text-lg font-medium">对话历史已清空</p>
                <p class="mt-2">输入消息开始新的对话</p>
            `;
        messagesContainer.appendChild(emptyDiv);
    }

    // 事件监听
    sendButton.addEventListener('click', sendMessage);

    stopButton.addEventListener('click', stopGeneration);

    clearHistoryBtn.addEventListener('click', clearHistory);

    // 输入框键盘事件
    messageInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            if (!isGenerating) {
                sendMessage();
            }
        }
    });

    // 示例消息按钮（可选功能）
    function addExampleButton(text) {
        const exampleBtn = document.createElement('button');
        exampleBtn.className = 'inline-block mr-3 mb-2 px-4 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg transition-colors text-sm';
        exampleBtn.textContent = text;
        exampleBtn.addEventListener('click', function() {
            messageInput.value = text;
            messageInput.focus();
        });
        return exampleBtn;
    }

    // 添加一些示例问题
    window.addEventListener('DOMContentLoaded', function() {
        const examplesContainer = document.createElement('div');
        examplesContainer.className = 'mt-6 mb-4';

        const examplesTitle = document.createElement('p');
        examplesTitle.className = 'text-gray-600 mb-2 font-medium';
        examplesTitle.textContent = '试试这些示例问题：';

        examplesContainer.appendChild(examplesTitle);

        const examples = [
            '1+1等于多少？',
            '用JavaScript写一个hello world程序',
            '解释一下什么是人工智能',
            '写一首关于春天的短诗'
        ];

        examples.forEach(example => {
            examplesContainer.appendChild(addExampleButton(example));
        });

        const inputContainer = document.querySelector('.bg-white.rounded-xl.shadow-sm.p-5');
        inputContainer.insertBefore(examplesContainer, inputContainer.firstChild);
    });
</script>
</body>
</html>
